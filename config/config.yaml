# wo-bot-control Configuration
# Author: Antonio Leung
# GitHub: https://github.com/al96169/wo-bot-control
# Package: com.antonioleung.wobot.control

# App Info
app:
  package: "com.antonioleung.wobot.control"
  author: "Antonio Leung"
  github: "https://github.com/al96169/wo-bot-control"
  license: "MIT"

# Robot Info
robot:
  id: "wobot-001"
  name: "My Robot"
  model: "jetson-nano"
  version: "1.0.0"

# Server Settings
server:
  host: "0.0.0.0"
  port: 8765
  http_port: 8000
  # 对外公告的 IP（用于 WebRTC SDP ICE candidate，局域网 mDNS 不可用时）
  # 留空则自动获取：先取 host（非 0.0.0.0 时），否则取本机局域网 IP
  advertised_ip: "192.168.1.47"

# mDNS Discovery
mdns:
  enabled: false
  service_type: "_wobot._tcp.local."
  port: 8765

# Status Update
status:
  update_interval: 1.0  # seconds
  subscribe_events:
    - "status"
    - "camera_status"
    - "module_status"

# Motion Control
motion:
  drive_type: "mecanum"  # mecanum, differential, ackermann
  max_linear_speed: 1.0
  max_angular_speed: 1.0
  default_mode: "manual"  # manual, semi, auto
  # 硬件后端: mock / serial / gpio / rosmaster
  hardware_type: "rosmaster"
  # Rosmaster 串口后端配置（/dev/ttyUSB0 = Rosmaster 主控板，/dev/ttyUSB1 = 备用）
  serial_port: "/dev/ttyUSB0"
  serial_baudrate: 115200
  # GPIO 引脚映射 (Jetson BOARD 编号)
  gpio_pins:
    front_left:  {pwm: 32, dir1: 33, dir2: 35}
    front_right: {pwm: 36, dir1: 37, dir2: 38}
    rear_left:   {pwm: 40, dir1: 41, dir2: 43}
    rear_right:  {pwm: 12, dir1: 13, dir2: 15}

# 导航（S0：运行模式状态机 + 里程计）
# 设计依据见 wo-bot-wiki/方案/自主巡航与避障方案.md
navigation:
  mode:
    # ⚠️ 自主模式**默认禁用**。开启后机器人在 semi/auto 下会自行介入控制
    # （限速/横移/急停/按航线行驶），请确认场地安全后再开启。
    # 即使开启，切换时仍要求前端二次确认（confirmed=true）。
    allow_semi: false
    allow_auto: false
  odometry:
    # ⚠️ 必须真机标定后才能给出可信位移。
    # counts_per_meter = 0 时：**航向可用（陀螺），但不产生位移**，属降级状态。
    # 标定方法：让机器人直行已知距离 D，读取四轮编码器增量之和/4 除以 D。
    counts_per_meter: 0.0
    # 麦轮几何（米）：影响原地旋转角度的解算
    wheel_base: 0.16
    track_width: 0.16
    # 航向优先使用陀螺（麦克纳姆轮横向打滑会让纯编码器航向快速漂移）
    use_gyro_heading: true
    # 启动时用于估计陀螺零偏的静止样本数（此时机器人不应在动）
    gyro_bias_samples: 50
  # 安全底座（S1）：任何一项触发都会立即停车 + 降级到 manual（并广播原因）
  # 触发后**不会自动恢复**，需用户显式解除（emergency_release）
  safety:
    watchdog_timeout_s: 0.5    # 导航心跳超时（秒）——超过则判定决策层已死
    low_battery_v: 10.5        # 低压阈值（12V 锂电池；读不到电压时跳过该项）
    tilt_limit_deg: 35.0       # 机身倾角上限，超过判定跌落/被搬动
    stall_timeout_s: 1.5       # 有运动指令但持续无位移超过此时长 → 判堵转
    stall_cmd_threshold: 0.15  # 判定"有指令"的速度阈值（m/s）
    stall_move_threshold: 0.01 # 判定"没在动"的速度阈值（m/s）
    perception_blocks_autonomy: true  # 感知不可用时按"有障碍"处理（S2 接入）
  # 纯视觉感知（S2 / V1 光流发散 → TTC）。算法已在真机验证，见方案 §3.6
  perception:
    width: 320                 # 处理分辨率：实测精度与算力的平衡点（单核约 9% @10Hz）
    height: 240
    fps: 30.0                  # 无时间戳时的帧率兜底（τ 的单位换算依赖它，不能省）
    max_corners: 150
    min_features: 8            # 可用特征少于此值 → 判定感知不可信（遮挡/无纹理）
    min_brightness: 20.0       # 亮度低于此值 → 判定"暗光失效"（视觉原理性失效）
    rotation_gate_dps: 90.0    # 转速超过此值 → 暂停 TTC 判据（实测 CSI 场景 180°/s 会误报）
    block_ttc: 3.0             # TTC 低于此值 → 该扇区判为"有障碍阻挡"
    half_fov_deg: 30.0         # 相机水平半视场角（用于旋转补偿的焦距估计）

# Camera
camera:
  enabled: true
  default_camera: 0
  resolution:
    width: 1280
    height: 960
  fps: 30
  stream_type: "mjpeg"  # mjpeg, webrtc
  capture_quality: "high"  # 拍照画质: high | medium | low
  record_quality: "high"    # 录像画质: high | medium | low

# Gimbal
gimbal:
  enabled: true                # 设为 true 启用云台控制
  gimbal_type: "rosmaster"      # 硬件后端: mock / pca9685 / gpio_pwm / rosmaster
  # Rosmaster 后端配置
  com: "/dev/ttyUSB0"          # Rosmaster 串口设备路径（实际设备 /dev/ttyUSB0）
  car_type: 1                   # 小车类型
  pan_channel: 4                # 左右云台 servo_id (4号位)
  tilt_channel: 3               # 俯仰云台 servo_id (3号位)
  pan_min: 0                    # 角度限制 (Rosmaster 0-180)
  pan_max: 180
  pan_center: 90               # 回中位置，默认为 (pan_min + pan_max) / 2
  tilt_min: 30                  # -60° 映射到 30
  tilt_max: 150                 # +60° 映射到 150
  # 方向反转
  pan_invert: true              # pan 水平反转（true=左右对调）
  tilt_center: 90               # 回中位置，默认为 (tilt_min + tilt_max) / 2
  tilt_invert: false            # 反转俯仰方向 (摇杆向上→舵机逆时针)
  step: 3.0                     # 增量模式每步移动角度

# Sensor Recorder（传感器数据持久化，R00045）
sensor_recorder:
  enabled: true
  db_path: "data/peripherals.db"     # SQLite 文件路径
  retention_days: 7                  # 数据保留天数
  cleanup_interval_hours: 1          # 清理间隔

# Power Policy
power_policy:
  threshold: 30  # 省电阀值（电量百分比），范围 10-50

# IR Remote (红外遥控, R00020)
ir:
  enabled: true
  port: "/dev/ttyTHS1"
  baudrate: 115200
  module_addr: 0x00
  data_dir: "data/ir_codes"
  learn_timeout: 30

modules:
  auto_load: true
  module_dir: "src/modules/extension"

# Logging
logging:
  level: "INFO"
  file: "logs/wobot.log"
  max_size: "10MB"
  backup_count: 5

# Security
security:
  auth_enabled: false
  # 当 auth_enabled=true 时，客户端需通过 URL query ?token=xxx 或首条 auth 消息认证
  token: "change-me-to-a-secure-random-string"

# Compatibility
compatibility:
  # 最低支持的客户端协议版本，低于此版本的客户端会被拒绝连接
  min_protocol_version: 1
  # 是否拒绝比服务端更新的客户端（默认 false，新客户端兼容旧服务端）
  reject_newer: false

# Debug
debug:
  # 强制最低协议版本（0 表示使用 compatibility.min_protocol_version）
  # 测试版本拒绝场景时，设置此值 > 客户端当前协议版本即可触发
  force_min_protocol_version: 0

# Binding（客户端绑定认证）
binding:
  enabled: true
  # ROBOT_SECRET：留空则首次启动自动生成并保存到 config/.binding_secret
  secret: ""
  max_clients: 10           # 最多绑定客户端数
  max_failures: 5            # 连续验证失败上限
  cooldown_seconds: 300      # 失败上限后冷却时间（秒）
  session_timeout: 120       # 绑定会话有效期（秒）
  # 密码绑定（兜底方案：设备无外设时使用）
  password_enabled: true    # 是否开启密码绑定方式
  password: "wobot123"      # 初始密码（首次启动后哈希存储到 config/.binding_password，后续通过配置界面修改）
  # 支持的绑定方式开关（关闭后客户端绑定界面将不再显示该方式）
  methods:
    display: true           # 屏幕显示验证码
    tts: true               # 语音播报验证码
    qr_scan: false          # 二维码扫描（待定开发，默认关闭）
    gimbal: true            # 云台动作验证
    password: true          # 密码绑定
    share_code: true        # 分享码绑定

# Software Manager（软件包管理）
software_manager:
  market_endpoint: "http://192.168.1.75:9099"  # wo-bot-market 市场服务器地址（开发电脑）
  manifest_cache_ttl: 300                   # 白名单缓存时长（秒）
  operation_timeout: 120                    # 安装/卸载/升级超时（秒）

# Account Server（帐号服务器，R00040）
# 设备注册、心跳、OAuth2 绑定证明签发
account:
  enabled: false                              # 是否启用帐号服务器集成（部署公共服务后设为 true）
  server_url: "https://account.example.com"   # 帐号服务器地址（部署时替换）（必须HTTPS）

# Signal Server（信令服务器，R00036）
# 跨网络远程控制：WebRTC 信令中继
signal:
  enabled: false                              # 是否启用信令服务器（部署后设为 true）
  server_url: "wss://signal.example.com/ws"   # 信令服务器地址（部署时替换）
  # ROBOT_SECRET 从 config/.binding_secret 读取（与 account 共用）
